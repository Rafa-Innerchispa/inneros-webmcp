<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InnerOS WebMCP — Judge Login</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}
    .login-card{width:min(420px,100%);padding:28px;border:1px solid #17343b;border-radius:22px;background:linear-gradient(180deg,rgba(10,24,29,.96),rgba(6,16,20,.96));box-shadow:0 22px 65px rgba(0,0,0,.25)}
    .login-card h1{margin:8px 0 6px;font-size:1.5rem}
    .login-card p{color:#829ea0;font-size:.82rem;line-height:1.5}
    .login-form{display:grid;gap:12px;margin-top:18px}
    .login-error{color:#e2a094;font-size:.78rem;min-height:1.2em}
  </style>
</head>
<body>
  <div class="login-shell">
    <section class="login-card">
      <p class="eyebrow">INNEROS WEBMCP</p>
      <h1>Judge login</h1>
      <p>Authenticate to open Mission Control. Credentials are configured server-side only; nothing sensitive is stored in this public repository.</p>
      <form id="loginForm" class="login-form">
        <label>Username
          <input id="username" name="username" autocomplete="username" required>
        </label>
        <label>Password
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="loginError" class="login-error" aria-live="polite"></p>
        <button id="loginSubmit" type="submit">Sign in</button>
      </form>
    </section>
  </div>
  <script type="module">
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const submit = document.getElementById('loginSubmit');
      submit.disabled = true;
      submit.textContent = 'Signing in…';
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        if (response.ok && data.ok) {
          window.location.replace('/');
          return;
        }
        errorEl.textContent = data.error === 'too_many_attempts'
          ? 'Too many failed attempts. Try again later.'
          : 'Invalid credentials or auth not configured.';
      } catch {
        errorEl.textContent = 'Login request failed.';
      } finally {
        submit.disabled = false;
        submit.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
