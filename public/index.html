<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InnerOS WebMCP</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><section class="left"><header><div><p class="eyebrow">INNEROS · WEBMCP</p><h1>Agent Operations Console</h1></div><span id="mcpBadge" class="badge">Checking WebMCP…</span></header><p class="sub">Operate approved agents from the web. Every state shown here comes from the bridge. No fake progress.</p><div class="cards" id="agents"></div><form id="dispatchForm"><label>Agent<select id="agent"><option value="local">Local</option><option value="codex">Codex</option><option value="cursor">Cursor</option><option value="antigravity">AntiGravity</option></select></label><label>Project<input id="project" value="inneros-webmcp" maxlength="120"></label><label>Instruction<textarea id="instruction" maxlength="2000" placeholder="Inspect the project and report the current blocker."></textarea></label><button type="submit">Dispatch through WebMCP bridge</button></form><pre id="result" class="result">Ready.</pre></section><section class="right"><header><div><p class="eyebrow">TRUTHFUL TELEMETRY</p><h2>Global Live Trace</h2></div><button id="clearTrace" class="ghost">Clear</button></header><div id="trace" class="trace"><div class="empty">No execution events yet.</div></div><footer><span>Allowed: Codex · Cursor · AntiGravity · Local</span><span id="health">Bridge: checking…</span></footer></section></main><script type="module" src="/app.js"></script></body></html>
