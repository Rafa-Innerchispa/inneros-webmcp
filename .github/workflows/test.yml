name: test
on:
  push:
    branches: [main, chatgpt/webmcp-vslice]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node --check src/server.js
      - run: node --check src/bridge.js
      - run: node --check src/inneros-adapter.js
      - run: node --check src/webmcp.js
      - run: node --check public/app.js
